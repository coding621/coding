spring:
  autoconfigure:
    exclude: com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
# 项目相关配置
coding:
  # 名称
  name: morpheus-coding
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2025
  # 实例演示开关
  demoEnabled: true
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math
  # 本地开发请修改 profile 为对应系统的路径 切记不能提交 保证 profile: /data/uploadPath 始终是这个 因为容器部署挂载的这个路径
  # Mac /usr/local/coding/uploadPath
  # Win D:/coding/uploadPath
  profile: /data/uploadPath

  # 企微消息相关
  workWx:
    host: https://morpheus.cn:7880
    corpid: corpid
    corpsecret: corpsecret
    addressSecret: addressSecret
    agentid: agentid
    aeskey: aeskey
    path: path

  # rocketMQ 配置
  rocketMQ:
    # 配置nameserver代理地址
    addr: 127.0.0.1:8081
    topic:
      # 企微消息topic
      wxMessage: coding_wx_message
    # 消费者组
    group:
      wxMessage: CODING_GROUP

# 日志配置
logging:
  level:
    com.morpheus.coding: info
    org.springframework: warn
  # 日志路径配置：测试及线上环境请勿修改保证 path: /data/logs 始终是这个 因为容器部署挂载的这个路径，本地环境可修改自己的存储路径
  file:
    name: logs/${spring.application.name}/info.log
    path: /data/logs

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz
  # 令牌有效期  本地开发可以配置大一些方便调试接口
  expireTime: 60000


# MyBatis-plus 配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.morpheus.coding.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*



# feign 配置
feign:
  sentinel:
    enabled: true
  okhttp:
    enabled: true
  httpclient:
    enabled: false
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 10000
  compression:
    request:
      enabled: true
      min-request-size: 8192
    response:
      enabled: true

# 暴露监控端点
management:
  endpoints:
    web:
      exposure:
        include: ' *'


# 实时log配置，可在http://localhost:6888/ 监控中心查看实时日志

